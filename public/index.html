<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Prajal Dixit is a React Native engineer in Bengaluru with 4+ years shipping iOS and Android apps across healthcare, commerce, and wellness. Open to full-time roles." />
  <link rel="canonical" href="https://prajaldixit.github.io/Portfolio/" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <title>Prajal Dixit · React Native Engineer</title>

  <!-- Apply the saved or system theme before first paint to avoid a light flash in dark mode -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem("prajal-theme"); } catch (e) {}
      if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- Open Graph / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://prajaldixit.github.io/Portfolio/" />
  <meta property="og:title" content="Prajal Dixit · React Native Engineer" />
  <meta property="og:description" content="4+ years building and shipping iOS and Android apps across healthcare, commerce, and wellness. Open to full-time roles." />
  <meta property="og:image" content="https://prajaldixit.github.io/Portfolio/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Prajal Dixit · React Native Engineer" />
  <meta name="twitter:description" content="4+ years building and shipping iOS and Android apps across healthcare, commerce, and wellness. Open to full-time roles." />
  <meta name="twitter:image" content="https://prajaldixit.github.io/Portfolio/og-image.png" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Prajal Dixit",
      "jobTitle": "React Native Engineer",
      "url": "https://prajaldixit.github.io/Portfolio/",
      "worksFor": { "@type": "Organization", "name": "MFine" },
      "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressCountry": "IN" },
      "alumniOf": "Shri Vaishnav Vidyapeeth Vishwavidyalaya",
      "knowsAbout": ["React Native", "TypeScript", "JavaScript", "Redux", "iOS", "Android"],
      "sameAs": ["https://www.linkedin.com/in/prajaldixit/", "https://github.com/prajaldixit"]
    }
  </script>
</head>
